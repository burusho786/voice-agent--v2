spring:
  application:
    name: voice-agent
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true
          no-store: true
          must-revalidate: true

  data:
    mongodb:
      uri: 
      auto-index-creation: true

  jwt:
    secret: 

server:
  port: 8080
  ssl:
    enabled: true
    key-store: classpath:keystore.p12
    key-store-password: changeit
    key-store-type: PKCS12
    key-alias: voiceagent

deepgram:
  api-key: 
  base-url: https://api.deepgram.com
  model: nova-3
  smart-format: true
  tts:
    model: aura-2-thalia-en
    speed: 1.1
    encoding: mp3
    bitrate: 24000

audio:
  max-file-size: 15MB
  allowed-content-types:
    - audio/wav
    - audio/x-wav
    - audio/mpeg
    - audio/mp3
    - audio/webm
    - audio/ogg
    - audio/mp4
    - audio/m4a

ollama:
  base-url: http://localhost:11434
  model: gemma3:4b
  keep-alive: 30m
  num-predict: 200
  connect-timeout: 5s
  read-timeout: 120s
  embedding:
    base-url: http://localhost:11434
    model: nomic-embed-text

