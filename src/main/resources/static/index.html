<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Voice</title>
    <style>
        :root {
          --bg:            #f4f4f6;
          --surface:       #ffffff;
          --surface-2:     #ededf1;
          --surface-3:     #e3e3e8;
          --border:        #e2e2e8;
          --border-strong: #cacad2;
          --text:          #1a1a1f;
          --text-muted:    #6e6e78;
          --text-dim:      #9a9aa5;
          --accent:        #2a2a30;
          --danger:        #e85c5c;
          --danger-soft:   #ff8a8a;
          --success:       #4ba86a;

          --bubble-idle-hi:   #ffffff;
          --bubble-idle-lo:   #d8d8de;
          --bubble-rec-hi:    #ffffff;
          --bubble-rec-lo:    #ffb8b8;

          --glow-idle: rgba(140, 140, 155, 0.35);
          --glow-rec:  rgba(232,  92,  92, 0.55);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
          margin: 0;
          height: 100%;
          background: var(--bg);
          color: var(--text);
          font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
          font-size: 15px;
          line-height: 1.5;
          -webkit-font-smoothing: antialiased;
          text-rendering: optimizeLegibility;
        }

        /* ============================================================
           AUTH SCREEN
           ============================================================ */

        .login-screen {
          display: flex;
          align-items: center;
          justify-content: center;
          min-height: 100vh;
          min-height: 100dvh;
          padding: 24px;
        }

        .login-card {
          width: 100%;
          max-width: 340px;
          display: flex;
          flex-direction: column;
          gap: 4px;
        }

        .login-card h1 {
          margin: 0 0 4px;
          font-size: 15px;
          font-weight: 600;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: var(--text);
        }

        .login-card p.sub {
          margin: 0 0 28px;
          font-size: 13px;
          color: var(--text-muted);
        }

        .login-card input {
          width: 100%;
          padding: 12px 0;
          background: transparent;
          border: none;
          border-bottom: 1px solid var(--border);
          border-radius: 0;
          color: var(--text);
          font-size: 15px;
          font-family: inherit;
          outline: none;
          transition: border-color 0.2s;
        }
        .login-card input::placeholder { color: var(--text-dim); }
        .login-card input:focus { border-bottom-color: var(--accent); }

        .login-card button[type="submit"] {
          margin-top: 24px;
          width: 100%;
          padding: 13px 16px;
          background: var(--accent);
          color: #ffffff;
          border: none;
          border-radius: 8px;
          font-size: 14px;
          font-weight: 600;
          font-family: inherit;
          cursor: pointer;
          transition: opacity 0.15s, transform 0.1s;
        }
        .login-card button[type="submit"]:hover:not(:disabled) { opacity: 0.88; }
        .login-card button[type="submit"]:active:not(:disabled) { transform: scale(0.99); }
        .login-card button[type="submit"]:disabled { opacity: 0.4; cursor: not-allowed; }

        .login-card .link-btn {
          margin-top: 6px;
          background: transparent;
          border: none;
          color: var(--text-muted);
          font-size: 13px;
          font-family: inherit;
          padding: 8px;
          cursor: pointer;
          transition: color 0.15s;
        }
        .login-card .link-btn:hover:not(:disabled) { color: var(--text); }

        .auth-msg {
          margin-top: 10px;
          font-size: 12.5px;
          min-height: 18px;
          color: var(--text-muted);
        }
        .auth-msg.error   { color: #c43838; }
        .auth-msg.success { color: var(--success); }

        /* ============================================================
           CHAT SCREEN
           ============================================================ */

        .app {
          display: none;
          flex-direction: column;
          height: 100vh;
          height: 100dvh;
          max-width: 720px;
          margin: 0 auto;
          background: var(--bg);
        }
        .app.active { display: flex; }

        header {
          display: flex;
          align-items: center;
          gap: 10px;
          padding: 16px 20px;
          border-bottom: 1px solid var(--border);
          background: var(--surface);
        }
        header .dot {
          width: 6px;
          height: 6px;
          border-radius: 50%;
          background: var(--success);
        }
        header h1 {
          flex: 1;
          margin: 0;
          font-size: 14px;
          font-weight: 600;
          letter-spacing: 0.02em;
          color: var(--text);
        }
        header button.logout {
          background: transparent;
          border: none;
          color: var(--text-muted);
          font-size: 13px;
          font-family: inherit;
          padding: 6px 4px;
          cursor: pointer;
          transition: color 0.15s;
        }
        header button.logout:hover { color: var(--text); }

        #messages {
          flex: 1;
          overflow-y: auto;
          padding: 28px 20px;
          display: flex;
          flex-direction: column;
          gap: 18px;
        }

        .msg {
          font-size: 15px;
          line-height: 1.55;
          word-wrap: break-word;
          white-space: pre-wrap;
          animation: fade 0.18s ease-out;
        }
        @keyframes fade {
          from { opacity: 0; transform: translateY(3px); }
          to   { opacity: 1; transform: translateY(0); }
        }

        .msg.user {
          align-self: flex-end;
          max-width: 82%;
          padding: 10px 14px;
          background: var(--surface);
          border: 1px solid var(--border);
          border-radius: 14px;
          border-bottom-right-radius: 4px;
          color: var(--text);
          box-shadow: 0 1px 2px rgba(0,0,0,0.03);
        }

        .msg.agent {
          align-self: flex-start;
          max-width: 88%;
          padding: 2px 0;
          color: var(--text);
        }

        .msg.system {
          align-self: flex-start;
          color: var(--text-dim);
          font-size: 13px;
          padding: 2px 0;
        }

        .msg.error {
          align-self: center;
          max-width: 90%;
          text-align: center;
          color: #c43838;
          font-size: 13px;
          padding: 8px 12px;
          border: 1px solid #f0c4c4;
          background: #fff5f5;
          border-radius: 10px;
        }

        .typing {
          align-self: flex-start;
          display: inline-flex;
          gap: 4px;
          padding: 4px 0;
        }
        .typing span {
          width: 5px;
          height: 5px;
          border-radius: 50%;
          background: var(--text-dim);
          animation: blink 1.2s infinite;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink {
          0%, 60%, 100% { opacity: 0.25; }
          30%           { opacity: 1; }
        }

        /* ============================================================
           FOOTER — status + interactive bubble
           ============================================================ */

        footer {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 12px;
          padding: 26px 20px 36px;
          border-top: 1px solid var(--border);
          background: var(--surface);
          position: relative;
        }

        #status {
          font-size: 12.5px;
          color: var(--text-muted);
          min-height: 16px;
          transition: color 0.2s;
          letter-spacing: 0.01em;
          user-select: none;
        }
        #status.recording  { color: var(--danger); }
        #status.processing { color: var(--text); }

        .btn-wrap {
          position: relative;
          display: flex;
          align-items: center;
          justify-content: center;
          width: 160px;
          height: 160px;
        }

        /* ---------- oscillator (rings above the bubble) ---------- */

        .osc {
          position: absolute;
          top: -6px;
          left: 50%;
          transform: translateX(-50%);
          width: 6px;
          height: 6px;
          pointer-events: none;
          display: none;
        }
        .osc.active { display: block; }

        .osc .ring {
          position: absolute;
          top: 50%;
          left: 50%;
          width: 8px;
          height: 8px;
          margin: -4px 0 0 -4px;
          border-radius: 50%;
          background: var(--danger-soft);
          opacity: 0.6;
          animation: osc 1.6s ease-out infinite;
        }
        .osc .ring:nth-child(2) { animation-delay: 0.4s; }
        .osc .ring:nth-child(3) { animation-delay: 0.8s; }

        @keyframes osc {
          0%   { transform: scale(0.8); opacity: 0.65; }
          80%  { transform: scale(3.2); opacity: 0; }
          100% { transform: scale(3.2); opacity: 0; }
        }

        /* ---------- the glowing bubble ---------- */

        #recordBtn {
          position: relative;
          width: 96px;
          height: 96px;
          border-radius: 50%;
          border: none;
          background: radial-gradient(
            circle at 32% 28%,
            var(--bubble-idle-hi) 0%,
            #ececf1 45%,
            var(--bubble-idle-lo) 100%
          );
          box-shadow:
            0 10px 24px rgba(60, 60, 80, 0.10),
            0 2px 6px rgba(60, 60, 80, 0.06),
            inset 0 -6px 14px rgba(120, 120, 140, 0.18),
            inset 0 6px 10px rgba(255, 255, 255, 0.9),
            0 0 0 0 var(--glow-idle);
          cursor: pointer;
          touch-action: none;
          user-select: none;
          -webkit-user-select: none;
          transition:
            transform 0.12s ease-out,
            box-shadow 0.28s ease-out,
            background 0.28s ease-out;
          display: flex;
          align-items: center;
          justify-content: center;
          outline: none;
        }

        /* inner highlight */
        #recordBtn::before {
          content: "";
          position: absolute;
          top: 14%;
          left: 22%;
          width: 40%;
          height: 26%;
          border-radius: 50%;
          background: radial-gradient(
            ellipse at center,
            rgba(255, 255, 255, 0.9) 0%,
            rgba(255, 255, 255, 0) 70%
          );
          pointer-events: none;
        }

        /* the small icon glyph inside */
        #recordBtn::after {
          content: "";
          width: 20px;
          height: 20px;
          border-radius: 50%;
          background: var(--text);
          opacity: 0.75;
          transition: width 0.2s, height 0.2s, border-radius 0.2s, background 0.2s, opacity 0.2s;
          box-shadow: 0 1px 2px rgba(0,0,0,0.15);
        }

        #recordBtn:hover:not(:disabled) {
          box-shadow:
            0 12px 28px rgba(60, 60, 80, 0.13),
            0 2px 6px rgba(60, 60, 80, 0.08),
            inset 0 -6px 14px rgba(120, 120, 140, 0.18),
            inset 0 6px 10px rgba(255, 255, 255, 0.95),
            0 0 18px 2px var(--glow-idle);
        }

        /* pressed feedback */
        #recordBtn.pressed,
        #recordBtn:active:not(:disabled) {
          transform: scale(0.94);
        }

        #recordBtn:disabled {
          opacity: 0.45;
          cursor: not-allowed;
        }

        /* ---------- recording state ---------- */

        #recordBtn.recording {
          background: radial-gradient(
            circle at 32% 28%,
            var(--bubble-rec-hi) 0%,
            #ffe3e3 45%,
            var(--bubble-rec-lo) 100%
          );
          box-shadow:
            0 14px 30px rgba(200, 60, 60, 0.18),
            0 2px 6px rgba(200, 60, 60, 0.10),
            inset 0 -6px 14px rgba(200, 80, 80, 0.22),
            inset 0 6px 10px rgba(255, 255, 255, 0.95),
            0 0 28px 4px var(--glow-rec),
            0 0 60px 10px rgba(232, 92, 92, 0.25);
          animation: breathe 1.8s ease-in-out infinite;
        }

        #recordBtn.recording::after {
          width: 22px;
          height: 22px;
          border-radius: 4px;               /* square = stop */
          background: var(--danger);
          opacity: 1;
        }

        @keyframes breathe {
          0%, 100% {
            box-shadow:
              0 14px 30px rgba(200, 60, 60, 0.18),
              0 2px 6px rgba(200, 60, 60, 0.10),
              inset 0 -6px 14px rgba(200, 80, 80, 0.22),
              inset 0 6px 10px rgba(255, 255, 255, 0.95),
              0 0 24px 3px rgba(232, 92, 92, 0.45),
              0 0 50px 8px rgba(232, 92, 92, 0.18);
          }
          50% {
            box-shadow:
              0 14px 30px rgba(200, 60, 60, 0.22),
              0 2px 6px rgba(200, 60, 60, 0.12),
              inset 0 -6px 14px rgba(200, 80, 80, 0.26),
              inset 0 6px 10px rgba(255, 255, 255, 0.95),
              0 0 36px 6px rgba(232, 92, 92, 0.65),
              0 0 70px 14px rgba(232, 92, 92, 0.28);
          }
        }

        /* processing state — non-interactive, soft grey */
        #recordBtn.processing {
          background: radial-gradient(
            circle at 32% 28%,
            #ffffff 0%,
            #eeeeee 45%,
            #d0d0d6 100%
          );
          box-shadow:
            0 8px 20px rgba(60, 60, 80, 0.10),
            0 2px 6px rgba(60, 60, 80, 0.06),
            inset 0 -4px 10px rgba(120, 120, 140, 0.15),
            inset 0 4px 8px rgba(255, 255, 255, 0.9);
          animation: spin 1.6s linear infinite;
        }
        @keyframes spin {
          0%   { transform: scale(0.96); }
          50%  { transform: scale(1.0); }
          100% { transform: scale(0.96); }
        }
        #recordBtn.processing::after {
          width: 18px;
          height: 18px;
          border-radius: 50%;
          background: var(--text-dim);
          opacity: 0.8;
        }

        .timer {
          position: absolute;
          top: -26px;
          left: 50%;
          transform: translateX(-50%);
          font-size: 11px;
          color: var(--danger);
          font-variant-numeric: tabular-nums;
          letter-spacing: 0.08em;
          white-space: nowrap;
          font-weight: 600;
        }

        /* scrollbar */
        #messages::-webkit-scrollbar { width: 6px; }
        #messages::-webkit-scrollbar-track { background: transparent; }
        #messages::-webkit-scrollbar-thumb {
          background: var(--border-strong);
          border-radius: 3px;
        }
    </style>
</head>
<body>

<!-- ================= AUTH SCREEN ================= -->
<div id="loginScreen" class="login-screen">
    <form id="authForm" class="login-card">
        <h1 id="authTitle">Sign in</h1>
        <p class="sub" id="authSub">Use your account to access the voice agent</p>

        <input id="email" type="email" placeholder="Email"
               autocomplete="email" required />
        <input id="password" type="password" placeholder="Password"
               autocomplete="current-password" required minlength="6" />

        <button type="submit" id="authSubmit">Sign in</button>
        <button type="button" id="authToggle" class="link-btn">
            Don't have an account? Create one
        </button>

        <div id="authMsg" class="auth-msg"></div>
    </form>
</div>

<!-- ================= CHAT SCREEN ================= -->
<div id="chatScreen" class="app">
    <header>
        <div class="dot"></div>
        <h1>Voice</h1>
        <button class="logout" id="logoutBtn">Sign out</button>
    </header>

    <div id="messages"></div>

    <footer>
        <div id="status">Hold to speak</div>
        <div class="btn-wrap">
            <div class="osc" id="osc" aria-hidden="true">
                <div class="ring"></div>
                <div class="ring"></div>
                <div class="ring"></div>
            </div>
            <button id="recordBtn" title="Hold to record" aria-label="Hold to record"></button>
            <div class="timer" id="timer" style="display:none;">0:00</div>
        </div>
    </footer>
</div>

<script>
    (() => {
      "use strict";

      /* ---------- endpoints ---------- */
      const LOGIN_URL    = "/api/auth/login";
      const REGISTER_URL = "/api/auth/register";
      const VOICE_URL    = "/api/final/process-with-metadata";

      /* ---------- storage keys ---------- */
      const KEY_ACCESS_TOKEN = "va_accessToken";
      const KEY_TOKEN_TYPE   = "va_tokenType";
      const KEY_EXPIRES_AT   = "va_expiresAt";

      /* ---------- interaction constants ---------- */
      const MIN_HOLD_MS = 350;   // ignore accidental taps shorter than this

      /* ---------- DOM ---------- */
      const loginScreen = document.getElementById("loginScreen");
      const chatScreen  = document.getElementById("chatScreen");
      const authForm    = document.getElementById("authForm");
      const authTitle   = document.getElementById("authTitle");
      const authSub     = document.getElementById("authSub");
      const authSubmit  = document.getElementById("authSubmit");
      const authToggle  = document.getElementById("authToggle");
      const authMsg     = document.getElementById("authMsg");
      const emailEl     = document.getElementById("email");
      const passwordEl  = document.getElementById("password");
      const logoutBtn   = document.getElementById("logoutBtn");

      const messagesEl = document.getElementById("messages");
      const statusEl   = document.getElementById("status");
      const recordBtn  = document.getElementById("recordBtn");
      const timerEl    = document.getElementById("timer");
      const oscEl      = document.getElementById("osc");

      /* ============================================================
         AUTH STATE
         ============================================================ */

      let authMode = "login";

      function saveAuth(accessToken, tokenType, expiresIn) {
        localStorage.setItem(KEY_ACCESS_TOKEN, accessToken);
        localStorage.setItem(KEY_TOKEN_TYPE, tokenType || "Bearer");
        if (typeof expiresIn === "number" && expiresIn > 0) {
          localStorage.setItem(KEY_EXPIRES_AT, String(Date.now() + expiresIn * 1000));
        } else {
          localStorage.removeItem(KEY_EXPIRES_AT);
        }
      }

      function clearAuth() {
        localStorage.removeItem(KEY_ACCESS_TOKEN);
        localStorage.removeItem(KEY_TOKEN_TYPE);
        localStorage.removeItem(KEY_EXPIRES_AT);
      }

      function getAccessToken() { return localStorage.getItem(KEY_ACCESS_TOKEN); }

      function isTokenValid() {
        const token = getAccessToken();
        if (!token) return false;
        const expiryStr = localStorage.getItem(KEY_EXPIRES_AT);
        if (!expiryStr) return true;
        return Date.now() < Number(expiryStr);
      }

      function buildAuthHeader() {
        const token = getAccessToken();
        if (!token) return null;
        const type = localStorage.getItem(KEY_TOKEN_TYPE) || "Bearer";
        return `${type} ${token}`;
      }

      /* ============================================================
         SCREEN ROUTING
         ============================================================ */

      function showLogin() {
        loginScreen.style.display = "flex";
        chatScreen.classList.remove("active");
      }

      function showChat() {
        loginScreen.style.display = "none";
        chatScreen.classList.add("active");
      }

      function setAuthMode(mode) {
        authMode = mode;
        authMsg.textContent = "";
        authMsg.className = "auth-msg";

        if (mode === "login") {
          authTitle.textContent = "Sign in";
          authSub.textContent = "Use your account to access the voice agent";
          authSubmit.textContent = "Sign in";
          authToggle.textContent = "Don't have an account? Create one";
          passwordEl.setAttribute("autocomplete", "current-password");
        } else {
          authTitle.textContent = "Create account";
          authSub.textContent = "Register to use the voice agent";
          authSubmit.textContent = "Create account";
          authToggle.textContent = "Already have an account? Sign in";
          passwordEl.setAttribute("autocomplete", "new-password");
        }
      }

      function setAuthMessage(text, kind) {
        authMsg.textContent = text || "";
        authMsg.className = "auth-msg" + (kind ? " " + kind : "");
      }

      /* ============================================================
         AUTH API
         ============================================================ */

      async function handleAuthSubmit(e) {
        e.preventDefault();
        setAuthMessage("");

        const email = emailEl.value.trim();
        const password = passwordEl.value;

        if (!email || !password) {
          setAuthMessage("Email and password are required.", "error");
          return;
        }

        const originalLabel = authMode === "login" ? "Sign in" : "Create account";
        authSubmit.disabled = true;
        authSubmit.textContent = authMode === "login" ? "Signing in…" : "Creating account…";

        try {
          const url = authMode === "login" ? LOGIN_URL : REGISTER_URL;
          const res = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
          });

          if (authMode === "login") {
            if (!res.ok) {
              setAuthMessage(
                res.status === 401 || res.status === 403
                  ? "Invalid email or password."
                  : `Login failed (${res.status})`,
                "error"
              );
              return;
            }
            const body = await res.json();
            if (!body || !body.accessToken) {
              setAuthMessage("Login succeeded but no access token was returned.", "error");
              return;
            }
            saveAuth(body.accessToken, body.tokenType, body.expiresIn);
            emailEl.value = "";
            passwordEl.value = "";
            enterChat();
            return;
          }

          if (!res.ok) {
            let msg = `Registration failed (${res.status})`;
            try {
              const errBody = await res.json();
              if (errBody && (errBody.message || errBody.error)) {
                msg = errBody.message || errBody.error;
              }
            } catch (_) { /* ignore */ }
            setAuthMessage(msg, "error");
            return;
          }

          let body = null;
          try { body = await res.json(); } catch (_) { /* empty body is fine */ }

          if (body && body.accessToken) {
            saveAuth(body.accessToken, body.tokenType, body.expiresIn);
            emailEl.value = "";
            passwordEl.value = "";
            enterChat();
          } else {
            setAuthMode("login");
            setAuthMessage("Account created. Please sign in.", "success");
          }
        } catch (err) {
          setAuthMessage("Network error: " + err.message, "error");
        } finally {
          authSubmit.disabled = false;
          authSubmit.textContent = originalLabel;
        }
      }

      authForm.addEventListener("submit", handleAuthSubmit);

      authToggle.addEventListener("click", () => {
        setAuthMode(authMode === "login" ? "register" : "login");
      });

      logoutBtn.addEventListener("click", () => {
        clearAuth();
        messagesEl.innerHTML = "";
        setAuthMode("login");
        showLogin();
      });

      function enterChat() {
        showChat();
        messagesEl.innerHTML = "";
        addMessage("Hi. Hold the bubble and ask me anything.", "system");
      }

      /* ============================================================
         CHAT UI
         ============================================================ */

      function addMessage(text, role) {
        const div = document.createElement("div");
        div.className = "msg " + role;
        div.textContent = text;
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return div;
      }

      function addTypingIndicator() {
        const div = document.createElement("div");
        div.className = "typing";
        div.innerHTML = "<span></span><span></span><span></span>";
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return div;
      }

      function setStatus(text, cls) {
        statusEl.textContent = text;
        statusEl.className = cls || "";
      }

      /* ============================================================
         RECORDING
         ============================================================ */

      let mediaRecorder = null;
      let recordedChunks = [];
      let mediaStream = null;
      let timerInterval = null;
      let secondsElapsed = 0;
      let isBusy = false;
      let isRecording = false;
      let recordStartTs = 0;
      let pendingStop = false;   // set when user releases before MIN_HOLD_MS

      function startTimer() {
        secondsElapsed = 0;
        timerEl.textContent = "0:00";
        timerEl.style.display = "block";
        timerInterval = setInterval(() => {
          secondsElapsed++;
          const m = Math.floor(secondsElapsed / 60);
          const s = String(secondsElapsed % 60).padStart(2, "0");
          timerEl.textContent = `${m}:${s}`;
        }, 1000);
      }

      function stopTimer() {
        clearInterval(timerInterval);
        timerInterval = null;
        timerEl.style.display = "none";
      }

      function pickMimeType() {
        const candidates = [
          "audio/webm;codecs=opus",
          "audio/webm",
          "audio/ogg;codecs=opus",
          "audio/ogg",
          "audio/mp4"
        ];
        for (const c of candidates) {
          if (window.MediaRecorder && MediaRecorder.isTypeSupported(c)) return c;
        }
        return "";
      }

      function extensionFor(mime) {
        if (mime.includes("webm")) return "webm";
        if (mime.includes("ogg"))  return "ogg";
        if (mime.includes("mp4"))  return "m4a";
        return "bin";
      }

      async function startRecording() {
        if (isBusy || isRecording) return;

        if (!navigator.mediaDevices || !window.MediaRecorder) {
          addMessage("Your browser does not support audio recording.", "error");
          return;
        }

        try {
          mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch (err) {
          addMessage("Microphone access denied or unavailable.", "error");
          return;
        }

        const mimeType = pickMimeType();
        const options = mimeType ? { mimeType } : {};

        try {
          mediaRecorder = new MediaRecorder(mediaStream, options);
        } catch (err) {
          addMessage("Could not start recorder: " + err.message, "error");
          cleanupStream();
          return;
        }

        recordedChunks = [];

        mediaRecorder.addEventListener("dataavailable", (e) => {
          if (e.data && e.data.size > 0) recordedChunks.push(e.data);
        });
        mediaRecorder.addEventListener("stop", onRecordingStopped);
        mediaRecorder.addEventListener("error", (e) => {
          addMessage("Recorder error: " + (e.error?.message || "unknown"), "error");
          resetUi();
        });

        mediaRecorder.start();
        isRecording = true;
        recordStartTs = Date.now();

        recordBtn.classList.add("recording");
        oscEl.classList.add("active");
        setStatus("Recording… release to send", "recording");
        startTimer();
      }

      function stopRecording() {
        if (!mediaRecorder || mediaRecorder.state === "inactive") return;

        // If the user released the button before MIN_HOLD_MS, mark this as a discard.
        const held = Date.now() - recordStartTs;
        pendingStop = held < MIN_HOLD_MS;

        mediaRecorder.stop();
        stopTimer();
        isRecording = false;

        recordBtn.classList.remove("recording");
        oscEl.classList.remove("active");
        recordBtn.classList.add("processing");
        setStatus(pendingStop ? "Hold longer to record" : "Processing…", "processing");

        isBusy = !pendingStop;
        if (!pendingStop) {
          recordBtn.disabled = true;
        }
      }

      async function onRecordingStopped() {
        cleanupStream();

        // Discard too-short recordings
        if (pendingStop) {
          pendingStop = false;
          recordedChunks = [];
          resetUi();
          return;
        }

        if (recordedChunks.length === 0) {
          addMessage("No audio captured.", "error");
          resetUi();
          return;
        }

        const mimeType = mediaRecorder.mimeType || "audio/webm";
        const blob = new Blob(recordedChunks, { type: mimeType });
        recordedChunks = [];

        const ext = extensionFor(mimeType);
        const file = new File([blob], `recording.${ext}`, { type: mimeType });

        const typing = addTypingIndicator();
        const authHeader = buildAuthHeader();

        if (!authHeader) {
          typing.remove();
          addMessage("Session expired. Please sign in again.", "error");
          resetUi();
          clearAuth();
          setAuthMode("login");
          showLogin();
          return;
        }

        try {
          const formData = new FormData();
          formData.append("file", file);

          const res = await fetch(VOICE_URL, {
            method: "POST",
            headers: { "Authorization": authHeader },
            body: formData
          });

          typing.remove();

          if (res.status === 401 || res.status === 403) {
            addMessage("Session expired. Please sign in again.", "error");
            clearAuth();
            setAuthMode("login");
            showLogin();
            return;
          }

          if (!res.ok) {
            let detail = `Request failed (${res.status})`;
            try {
              const errBody = await res.json();
              if (errBody && errBody.message) detail = errBody.message;
            } catch (_) { /* ignore */ }
            addMessage(detail, "error");
            return;
          }

          const data = await res.json();

          if (data.transcript) addMessage(data.transcript, "user");
          if (data.response)   addMessage(data.response, "agent");

          if (data.audio) {
            playAudio(data.audio, data.audioMimeType || "audio/mpeg");
          }
        } catch (err) {
          typing.remove();
          addMessage("Network error: " + err.message, "error");
        } finally {
          resetUi();
        }
      }

      function playAudio(base64, mime) {
        try {
          const audio = new Audio(`data:${mime};base64,${base64}`);
          audio.play().catch(() => { /* autoplay may be blocked */ });
        } catch (_) { /* ignore */ }
      }

      function cleanupStream() {
        if (mediaStream) {
          mediaStream.getTracks().forEach((t) => t.stop());
          mediaStream = null;
        }
      }

      function resetUi() {
        isBusy = false;
        isRecording = false;
        pendingStop = false;
        recordBtn.disabled = false;
        recordBtn.classList.remove("recording", "processing", "pressed");
        oscEl.classList.remove("active");
        stopTimer();
        setStatus("Hold to speak");
      }

      /* ============================================================
         PRESS-AND-HOLD INTERACTION
         ============================================================ */

      function onPointerDown(e) {
        // Ignore right-click / middle-click — only primary button
        if (e.button !== undefined && e.button !== 0) return;
        if (isBusy || isRecording) return;

        e.preventDefault();

        recordBtn.classList.add("pressed");

        // Start asynchronously; microphone permission may take a moment
        startRecording();
      }

      function onPointerUp(e) {
        recordBtn.classList.remove("pressed");

        if (!isRecording) return;

        // Release → stop → triggers upload
        stopRecording();
      }

      recordBtn.addEventListener("pointerdown", onPointerDown);

      // Stop on ANY pointerup/cancel, anywhere on the page.
      // This handles the case where the user drags off the button while holding.
      document.addEventListener("pointerup", onPointerUp);
      document.addEventListener("pointercancel", onPointerUp);

      // Prevent iOS long-press selection / context menu on the button
      recordBtn.addEventListener("contextmenu", (e) => e.preventDefault());

      /* ============================================================
         INITIAL ROUTE
         ============================================================ */

      if (isTokenValid()) {
        enterChat();
      } else {
        clearAuth();
        setAuthMode("login");
        showLogin();
      }
    })();
</script>
</body>
</html>
